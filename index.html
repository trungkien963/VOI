<!doctype html>
<html lang="vi" data-theme="pop">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- MANDATORY: Declare support for both light and dark themes to prevent FOUC -->
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        const storedScheme = localStorage.getItem('color-scheme');
        if (storedScheme === 'light' || storedScheme === 'dark') {
          document.querySelector('meta[name="color-scheme"]').content = storedScheme;
        }
        const storedTheme = localStorage.getItem('fn-theme-id');
        if (storedTheme) {
          document.documentElement.dataset.theme = storedTheme;
        }
      } catch {}
    </script>
    <meta name="theme-color" content="#1243E0" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VOI" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-v3.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v3.png" />
    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      }
    </script>
    <title>VOI · Không còn né tránh, cùng VOI làm chủ chi tiêu</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
