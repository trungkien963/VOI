<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Nền Royal Cobalt (Primary App Icon) -->
  <rect width="512" height="512" rx="115" fill="#1E4FD3" />
  <!-- Khối Voi chính: Vòi chữ V + Thân Voi (Sky Blue sáng) -->
  <path d="M 420 170 L 420 340 L 160 340 L 100 220 L 135 220 L 170 290 L 230 170 Z" fill="#5B8DEF" />
  <!-- Tai Voi / Đồng tiền chữ O (Warm Cream, căn lề quang học cân đối) -->
  <circle cx="326" cy="255" r="68" fill="#F1EED5" />
  <!-- Mắt Voi (Trí nhớ siêu phàm — r=11 rõ nét ở kích thước nhỏ) -->
  <circle cx="236" cy="200" r="11" fill="#F1EED5" />
</svg>

